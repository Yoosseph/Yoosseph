<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 76 880 420" fill="none" role="img" aria-labelledby="title description">
  <title id="title">{{LOGIN}}'s GitHub stats</title>
  <desc id="description">{{SUMMARY}}. All-time statistics visible to the GitHub API, updated {{UPDATED}} UTC. A neural network connects activity nodes to the central GitHub logo.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#0d1520"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#142536"/><stop offset="1" stop-color="#101923"/></linearGradient>
    <linearGradient id="synapse"><stop stop-color="#3b82c4" stop-opacity=".25"/><stop offset=".5" stop-color="#66cfe0" stop-opacity=".65"/><stop offset="1" stop-color="#58a6ff" stop-opacity=".45"/></linearGradient>
    <radialGradient id="ambient"><stop stop-color="#2075a9" stop-opacity=".13"/><stop offset="1" stop-color="#2075a9" stop-opacity="0"/></radialGradient>
    <radialGradient id="node-halo"><stop stop-color="#53c8e3" stop-opacity=".14"/><stop offset="1" stop-color="#53c8e3" stop-opacity="0"/></radialGradient>
    <radialGradient id="core"><stop stop-color="#19364a"/><stop offset="1" stop-color="#101e2c"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card-clip"><rect x="1" y="77" width="878" height="418" rx="17"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .metric-icon { color:#80cde6; }
    .metric-label { fill:#b7c6d6; font-size:14px; text-anchor:middle; }
    .metric-value { fill:#e6f4ff; font-size:29px; font-weight:600; text-anchor:middle; font-variant-numeric:tabular-nums; }
    .metric-caption { fill:#8b9bad; font-size:12px; text-anchor:middle; }
    .core-label { fill:#b7c6d6; font-size:12px; text-anchor:middle; letter-spacing:1px; }
    .network { color:#8ed9ee; }
    .mobile-connections { display:none; }
    .signal { animation:signal-flow 2.8s linear infinite; }
    .satellite { animation:node-heartbeat 2.8s ease-in-out infinite; }
    .signal-0,.satellite-0 { animation-delay:-.18s; }
    .signal-1,.satellite-1 { animation-delay:-.91s; }
    .signal-2,.satellite-2 { animation-delay:-1.47s; }
    .signal-3,.satellite-3 { animation-delay:-.43s; }
    .signal-4,.satellite-4 { animation-delay:-1.95s; }
    .signal-5,.satellite-5 { animation-delay:-2.37s; }
    .core-ring { animation:core-heartbeat 2.8s ease-in-out infinite; }
    @keyframes signal-flow {
      0% { stroke-dashoffset:100;opacity:0; } 5% { opacity:.85; }
      26% { stroke-dashoffset:0;opacity:0; } 34% { stroke-dashoffset:100;opacity:0; }
      39% { opacity:.85; } 60%,100% { stroke-dashoffset:0;opacity:0; }
    }
    @keyframes node-heartbeat { 0%,20%,34%,54%,100% { stroke-opacity:.55; } 9%,43% { stroke-opacity:.95; } }
    @keyframes core-heartbeat { 0%,12%,34%,46%,74%,100% { opacity:.35; } 26%,60% { opacity:.8; } }
    @media (prefers-reduced-motion: reduce) { .signal,.satellite,.core-ring { animation:none; } }
    @media (max-width:600px) {
      .desktop-connections,.background-network { display:none; } .mobile-connections { display:inline; }
      .node-stars { transform:translate(206px,148px); } .node-contributions { transform:translate(674px,148px); }
      .node-commits { transform:translate(206px,280px); } .node-issues { transform:translate(674px,280px); }
      .node-prs { transform:translate(206px,412px); } .node-repositories { transform:translate(674px,412px); }
      .satellite { rx:156px; ry:64px; } .node-halo { rx:174px; ry:82px; }
      .metric-icon { transform:translate(-10px,-56px) scale(.833333); }
      .metric-label { font-size:26px; transform:translateY(5px); }
      .metric-value { font-size:34px; transform:translateY(-9px); }
      .metric-caption { font-size:14px; transform:translateY(11px); }
      .core { transform:translate(440px,280px); } .core-label { font-size:18px; }
    }
  </style>
  <rect x=".5" y="76.5" width="879" height="419" rx="18" fill="url(#surface)" stroke="#30363d"/>
  <g clip-path="url(#card-clip)">
    <g class="network">
      <ellipse cx="450" cy="280" rx="400" ry="258" fill="url(#ambient)"/>
      <g class="background-network">
        <g stroke="#416683" stroke-width=".7" opacity=".25">
          <path d="M47 139 148 174 279 100 388 150 594 99 731 187 830 114 819 291 734 380 831 448 622 471 448 426 248 469 151 371 47 441 65 279 148 174"/>
          <path d="M65 279 294 257 353 343 448 426M279 100 294 257 151 371 256 365 248 469M594 99 592 249 731 187M734 380 665 308 819 291M587 373 622 471M47 139 65 279M592 249 587 373 448 426"/>
        </g>
        <g fill="#69a9c9" opacity=".5">{{PARTICLES}}</g>
      </g>
      <g class="desktop-connections">{{CONNECTIONS}}</g>
      <g class="mobile-connections">{{MOBILECONNECTIONS}}</g>
      <g class="core" transform="translate(450 280)">
        <circle r="101" stroke="#305c7a" stroke-opacity=".22"/>
        <path d="M-79-63a101 101 0 0 1 129-27M76 66a101 101 0 0 1-123 24" stroke="#62aecb" stroke-opacity=".35" stroke-linecap="round"/>
        <circle class="core-ring" r="84" stroke="#66cfe0" opacity=".4" filter="url(#glow)"/>
        <circle r="74" fill="url(#core)" stroke="#477b9a" stroke-opacity=".85"/>
      <!-- Primer mark-github-16, copyright GitHub, Inc., MIT. See scripts/README.md. -->
      <path d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.031 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656" transform="translate(-33 -33) scale(4.125)" fill="#e6f4ff"/>
        <text class="core-label" y="53">GitHub</text>
      </g>
      {{NODES}}
    </g>
  </g>
</svg>

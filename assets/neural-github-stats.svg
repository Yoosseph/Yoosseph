  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .heading { fill:#e6edf3; font-size:27px; font-weight:650; letter-spacing:-.6px; }
    .subtitle,.footer { fill:#8b9bad; font-size:12px; }
    .metric-icon { color:#72bddc; }
    .metric-label { fill:#b7c6d6; font-size:14px; }
    .metric-value { fill:#e6f4ff; font-size:19px; font-weight:600; text-anchor:end; font-variant-numeric:tabular-nums; }
    .node-label { fill:#92a9bf; font-size:11px; letter-spacing:.2px; }
    .network { color:#8ed9ee; }
    .signal { animation:signal-flow 12s linear infinite; }
    .signal-1 { animation-delay:-2s; } .signal-2 { animation-delay:-4s; }
    .signal-3 { animation-delay:-6s; } .signal-4 { animation-delay:-8s; } .signal-5 { animation-delay:-10s; }
    .satellite { animation:node-breathe 8s ease-in-out infinite; }
    .satellite-1,.satellite-3 { animation-delay:-3s; } .satellite-2,.satellite-5 { animation-delay:-5s; }
    .core-ring { animation:core-breathe 9s ease-in-out infinite; }
    @keyframes signal-flow { 0% { stroke-dashoffset:100;opacity:0; } 7% { opacity:.65; } 28% { stroke-dashoffset:0;opacity:0; } 100% { stroke-dashoffset:0;opacity:0; } }
    @keyframes node-breathe { 0%,100% { stroke-opacity:.55; } 50% { stroke-opacity:.95; } }
    @keyframes core-breathe { 0%,100% { opacity:.4; } 50% { opacity:.75; } }
    @media (prefers-reduced-motion: reduce) { .signal,.satellite,.core-ring { animation:none; } }
    @media (max-width:600px) {
      .network { display:none; } .stat-panel { width:824px; } .metric-icon { display:none; }
      .metric-label { font-size:26px; transform:translateX(-24px); }
      .metric-value { font-size:29px; transform:translateX(452px); }
      .heading { font-size:36px; } .subtitle { font-size:21px; } .footer { font-size:19px; }
    }
  </style>

name: Update neural GitHub stats

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-stats.py'
      - 'scripts/neural-stats-template.svg'
      - 'scripts/test_generate_stats.py'
      - '.github/workflows/update-stats.yml'

permissions:
  contents: write

concurrency:
  group: neural-github-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test generator
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch statistics and generate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate-stats.py --username "$PROFILE_USERNAME"
      - name: Commit updated card
        run: |
          git add -- assets/neural-github-stats.svg
          if git diff --cached --quiet; then
            echo "Statistics card is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update neural GitHub statistics"
          git push
